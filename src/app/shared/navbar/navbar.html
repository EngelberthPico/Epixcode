<header
  class="site-header"
  [class.site-header--hero]="isHeroPage()"
  [class.site-header--transparent]="isHeroPage() && !scrolled()"
  [class.site-header--shadow]="scrolled()"
  [class.site-header--menu-open]="isMenuOpen()"
>
  <div class="navbar__inner">
    <a class="navbar__brand" [routerLink]="'/' | langLink" (click)="closeMenu()">
      <img class="navbar__logo" src="logo-icon.png" alt="Epix Code" />
      <span class="navbar__wordmark">epix<span class="navbar__wordmark-accent">code</span></span>
    </a>

    <!-- Antes de .navbar__menu a propósito, en dos sentidos: (1) fuera de
         .navbar__menu porque en móvil el menú entero está display:none
         hasta que se abre el hamburguesa, y no hay forma en CSS de "asomar"
         un descendiente de un ancestro con display:none — el selector de
         idioma tiene que vivir aquí para quedar visible sin abrir el menú.
         (2) ANTES del <nav> en el DOM (no después) porque en móvil
         .navbar__inner es flex-wrap: si .navbar__menu (flex-basis:100%)
         viniera primero, fuerza su propio salto de línea y empuja
         .navbar__tools a una tercera línea en vez de quedar junto al logo.
         En desktop esto no importa: `order` en navbar.scss controla el
         orden visual real, independiente del DOM. -->
    <div class="navbar__tools">
      <div class="navbar__lang" role="group" [attr.aria-label]="'nav.languageSwitcher' | translate">
        @for (lang of languages; track lang) {
          <button
            type="button"
            class="navbar__lang-btn"
            [class.navbar__lang-btn--active]="currentLang() === lang"
            [attr.aria-pressed]="currentLang() === lang"
            (click)="setLang(lang)"
          >
            {{ lang.toUpperCase() }}
          </button>
        }
      </div>

      <button
        type="button"
        class="navbar__toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        [attr.aria-label]="(isMenuOpen() ? 'nav.toggleMenuClose' : 'nav.toggleMenuOpen') | translate"
      >
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>
    </div>

    <nav class="navbar__menu" [class.navbar__menu--open]="isMenuOpen()">
      <ul class="navbar__links">
        <li>
          <a
            [routerLink]="'/' | langLink"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            >{{ 'nav.home' | translate }}</a
          >
        </li>
        <li>
          <a [routerLink]="'/about' | langLink" routerLinkActive="active" (click)="closeMenu()">{{
            'nav.about' | translate
          }}</a>
        </li>
        <li>
          <a [routerLink]="'/services' | langLink" routerLinkActive="active" (click)="closeMenu()">{{
            'nav.services' | translate
          }}</a>
        </li>
        <li>
          <a [routerLink]="'/how-it-works' | langLink" routerLinkActive="active" (click)="closeMenu()">{{
            'nav.howItWorks' | translate
          }}</a>
        </li>
        <li>
          <a [routerLink]="'/contact' | langLink" routerLinkActive="active" (click)="closeMenu()">{{
            'nav.contactUs' | translate
          }}</a>
        </li>
      </ul>

      <div class="navbar__actions">
        <a
          class="btn btn--primary navbar__cta"
          href="https://calendly.com/epixcode/freediagnosticcall"
          target="_blank"
          rel="noopener"
          (click)="closeMenu()"
          >{{ 'nav.contact' | translate }}</a
        >
      </div>
    </nav>
  </div>
</header>
