<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Epix Code — Automation, Web Development & AI Integration</title>
  <meta name="description" content="Epix Code helps businesses optimize their processes through automation, web development, and AI integration, backed by a full-service marketing team.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Canonical + hreflang por defecto (home). Angular los actualiza en
       cada navegación via shared/seo.util.ts para reflejar la página
       actual — igual que <title>, meta description y Open Graph/Twitter
       más abajo. Estos valores estáticos son el fallback que ven los bots
       que NO ejecutan JavaScript: Googlebot sí renderiza JS y ve el valor
       actualizado por ruta, pero los bots de vista previa social
       (Facebook/WhatsApp/Slack/Twitter) no lo ejecutan y siempre leerán
       este bloque estático (inglés, contenido de Home) sin importar la
       página compartida — solo se resuelve con SSR/prerender. -->
  <link rel="canonical" href="https://epixcode.com/">
  <link rel="alternate" hreflang="en" href="https://epixcode.com/">
  <link rel="alternate" hreflang="es" href="https://epixcode.com/es">
  <link rel="alternate" hreflang="x-default" href="https://epixcode.com/">

  <!-- Open Graph / Twitter Card: vista previa al compartir el link en
       redes sociales o chats (WhatsApp, Slack, etc.). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Epix Code">
  <meta property="og:title" content="Epix Code — Automation, Web Development & AI Integration">
  <meta property="og:description" content="We help businesses optimize their processes through automation, web development, and AI integration.">
  <meta property="og:image" content="https://epixcode.com/logofondonegro.png">
  <meta property="og:url" content="https://epixcode.com/">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="es_ES">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Epix Code — Automation, Web Development & AI Integration">
  <meta name="twitter:description" content="We help businesses optimize their processes through automation, web development, and AI integration.">
  <meta name="twitter:image" content="https://epixcode.com/logofondonegro.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
