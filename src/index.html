<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Epix Code — Automation, Web Development & AI Integration</title>
  <meta name="description" content="Epix Code helps businesses optimize their processes through automation, web development, and AI integration, backed by a full-service marketing team.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" href="favicon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Analytics 4 (gtag.js, ID G-G32X4QK32J) NO está hardcodeado
       acá a propósito: este archivo es el mismo en dev y producción (no
       pasa por fileReplacements), así que una etiqueta estática cargaría
       también en `ng serve` local. Se inyecta en este <head> en tiempo de
       ejecución desde shared/analytics.service.ts, solo cuando
       environment.production es true. Ese mismo servicio dispara el
       evento page_view a mano en cada NavigationEnd (config inicial trae
       send_page_view:false). -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Canonical + hreflang por defecto (home). Angular los actualiza en
       cada navegación via shared/seo.util.ts para reflejar la página
       actual — igual que <title>, meta description y Open Graph/Twitter
       más abajo. Estos valores estáticos son el fallback que ven los bots
       que NO ejecutan JavaScript: Googlebot sí renderiza JS y ve el valor
       actualizado por ruta, pero los bots de vista previa social
       (Facebook/WhatsApp/Slack/Twitter) no lo ejecutan y siempre leerán
       este bloque estático (inglés, contenido de Home) sin importar la
       página compartida — solo se resuelve con SSR/prerender. -->
  <link rel="canonical" href="https://epixcode.com/">
  <link rel="alternate" hreflang="en" href="https://epixcode.com/">
  <link rel="alternate" hreflang="es" href="https://epixcode.com/es">
  <link rel="alternate" hreflang="x-default" href="https://epixcode.com/">

  <!-- Open Graph / Twitter Card: vista previa al compartir el link en
       redes sociales o chats (WhatsApp, Slack, etc.). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Epix Code">
  <meta property="og:title" content="Epix Code — Automation, Web Development & AI Integration">
  <meta property="og:description" content="We help businesses optimize their processes through automation, web development, and AI integration.">
  <meta property="og:image" content="https://epixcode.com/og-share-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://epixcode.com/">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="es_ES">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Epix Code — Automation, Web Development & AI Integration">
  <meta name="twitter:description" content="We help businesses optimize their processes through automation, web development, and AI integration.">
  <meta name="twitter:image" content="https://epixcode.com/og-share-image.png">

  <!-- JSON-LD Organization: le da a Google datos estructurados de la marca
       (nombre, logo, redes) para el knowledge panel / rich results. Estático
       a propósito, no cambia por ruta ni por idioma. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Epix Code",
      "url": "https://epixcode.com/",
      "logo": "https://epixcode.com/logofondonegro.png",
      "email": "contact@epixcode.com",
      "sameAs": [
        "https://www.facebook.com/profile.php?id=61593194379351",
        "https://www.instagram.com/epix.code/"
      ]
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
